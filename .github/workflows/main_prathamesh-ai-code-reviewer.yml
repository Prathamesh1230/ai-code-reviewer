# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy Python app to Azure Web App - prathamesh-ai-code-reviewer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate project files
        run: |
          test -f streamlit_app.py
          test -f requirements.txt
          test -d src
          test -d data

      - name: Upload application source
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            streamlit_app.py
            requirements.txt
            src/
            data/
            .streamlit/
            README.md
            !**/__pycache__/**
            !**/*.pyc
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FB7C647F11F4076B040A969847B02AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3CCB2A50385C4CF78159699796557A84 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC5098512B2A4960A770E1A702DC22EB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: prathamesh-ai-code-reviewer
          slot-name: Production
          package: .
